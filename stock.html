<!doctype html>
<html lang="pt">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestão de Stock - Farmácia Web</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<strong>Farmácia Web</strong>


<nav>

<a href="dashboard.html">Dashboard</a>
<a href="produtos.html">Produtos</a>
<a href="vendas.html">Vendas</a>
<a href="stock.html">Stock</a>
<a href="compras.html">Compras</a>
<a href="fornecedores.html">Fornecedores</a>
<a href="relatorios.html">Relatórios</a>

<button onclick="logout()">
Sair
</button>

</nav>

</header>




<main>


<div class="page-head">

<div>

<h1>
Gestão de Stock
</h1>

<p>
Controle entradas, saídas, ajustes e produtos.
</p>

</div>


<button onclick="abrirMovimento()">
+ Movimento Stock
</button>


</div>




<div class="panel">


<div class="stock-toolbar">


<input 
id="busca"
placeholder="Pesquisar medicamento..."
oninput="carregarStock()"
>


</div>





<div class="table-wrap">


<table>


<thead>


<tr>

<th>Código</th>

<th>Produto</th>

<th>Princípio ativo</th>

<th>Stock</th>

<th>Mínimo</th>

<th>Validade</th>

<th>Situação</th>

<th>Ações</th>


</tr>


</thead>




<tbody id="tabelaStock">


<tr>

<td colspan="8">
A carregar...
</td>


</tr>


</tbody>


</table>


</div>


</div>


</main>






<!-- =========================
MODAL MOVIMENTO STOCK
========================= -->


<div id="modalStock" class="modal hidden">


<div class="modal-box">


<div class="modal-header">


<h2>
Movimento de Stock
</h2>



<button 
class="btn-fechar"
onclick="fecharModal()">

×


</button>


</div>




<form id="stockForm">



<input 
type="hidden"
id="produto_id"
>



<label>

Produto


<select id="produto" required>


<option value="">
Selecionar produto
</option>


</select>


</label>






<div class="grid2">


<label>

Tipo


<select id="tipo">


<option value="ENTRADA">
Entrada
</option>


<option value="SAIDA">
Saída
</option>


<option value="AJUSTE">
Ajuste
</option>


</select>


</label>





<label>

Quantidade


<input 
type="number"
id="quantidade"
min="1"
required
>


</label>


</div>





<div class="grid2">


<label>

Lote


<input 
id="lote"
maxlength="80"
>


</label>



<label>

Validade


<input 
type="date"
id="validade"
>


</label>



</div>






<label>

Fornecedor


<input 
id="fornecedor"
maxlength="160"
>


</label>






<label>

Preço compra


<input 
type="number"
id="preco_compra"
step="0.01"
value="0"
>


</label>






<label>

Observação


<textarea
id="observacao"
rows="3">
</textarea>


</label>





<div class="actions">


<button>
Guardar
</button>


<button 
type="button"
onclick="fecharModal()">

Cancelar

</button>


</div>



</form>



</div>


</div>









<!-- =========================
MODAL EDITAR PRODUTO
========================= -->


<div id="modalEditar" class="modal hidden">


<div class="modal-box">



<div class="modal-header">


<h2>
Editar Produto
</h2>



<button 
class="btn-fechar"
onclick="fecharEditar()">

×

</button>


</div>






<form id="editarForm">


<input 
type="hidden"
id="editar_id"
>




<div class="grid2">


<label>

Código


<input 
id="editar_codigo"
required
>


</label>





<label>

Nome


<input 
id="editar_nome"
required
>


</label>



</div>







<label>

Princípio ativo


<input 
id="editar_principio"
>


</label>






<label>

Categoria


<input 
id="editar_categoria"
>


</label>







<div class="grid2">


<label>

Stock


<input 
type="number"
id="editar_stock"
>


</label>





<label>

Stock mínimo


<input 
type="number"
id="editar_minimo"
>


</label>



</div>






<div class="actions">


<button>
Guardar Alteração
</button>



<button 
type="button"
onclick="fecharEditar()">

Cancelar

</button>


</div>



</form>



</div>


</div>







<script src="js/app.js"></script>

<script src="js/auth.js"></script>

<script src="js/stock.js"></script>


</body>

</html>
