<body>

<main>
<div class="page-head">
    <div><h1>Faturas / Recibos</h1>
    <p>Vendas finalizadas e respetivos números de fatura.</p>
</div></div><p id="invoiceMessage" class="msg">
</p><section class="panel invoice-company-panel">
<h2>Dados da empresa na fatura</h2><form id="companyForm" class="form-grid"><label>Nome da empresa<input id="companyName" name="nome_empresa" required>

<div id="invoiceModal" class="modal hidden"><div class="modal-box invoice-modal-box"><div class="modal-header"><div><h2 id="invoiceTitle">Fatura</h2><p>Detalhes da venda</p></div><button id="closeInvoice" class="btn-close" type="button" aria-label="Fechar">&times;</button></div><div id="invoiceDetails" class="invoice-details"></div><div class="actions"><button id="saveInvoice" type="button">Guardar alterações</button><button type="button" class="secondary" onclick="closeInvoice()">Fechar</button></div></div></div>
