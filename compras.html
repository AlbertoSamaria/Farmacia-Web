<!doctype html>
<html lang="pt">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Compras - Farmácia Web</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<strong>
Farmácia Web
</strong>


<nav>

<a href="dashboard.html">
Dashboard
</a>

<a href="produtos.html">
Produtos
</a>

<a href="compras.html">
Compras
</a>

<a href="fornecedores.html">
Fornecedores
</a>

<a href="stock.html">
Stock
</a>


<button onclick="logout()">
Sair
</button>


</nav>


</header>






<main>



<div class="page-head">


<div>

<h1>
Registo de Compras
</h1>


<p>
Entrada de medicamentos e atualização automática do stock.
</p>


</div>



<button onclick="finalizarCompra()">
Finalizar Compra
</button>


</div>







<section class="panel">


<h2>
Dados da Compra
</h2>



<div class="grid2">


<label>

Fornecedor


<select id="fornecedor" required>


<option value="">
Selecionar fornecedor
</option>


</select>


</label>





<label>

Data da compra


<input 
type="date"
id="data_compra"
>


</label>



</div>


</section>








<section class="panel">


<h2>
Adicionar Produto
</h2>




<div class="grid2">



<label>

Produto


<select id="produtoCompra">


<option value="">
Selecionar produto
</option>


</select>


</label>






<label>

Quantidade


<input 
type="number"
id="quantidade"
min="1"
value="1"
>


</label>



</div>







<div class="grid2">


<label>

Preço compra


<input
type="number"
id="preco_compra"
step="0.01"
>


</label>





<label>

Lote


<input
id="lote"
maxlength="80"
>


</label>


</div>






<label>

Validade


<input
type="date"
id="validade"
>


</label>







<button onclick="adicionarItemCompra()">

+ Adicionar Produto

</button>




</section>









<section class="panel">


<h2>
Produtos da Compra
</h2>





<div class="table-wrap">


<table>


<thead>


<tr>

<th>
Produto
</th>


<th>
Quantidade
</th>


<th>
Preço
</th>


<th>
Lote
</th>


<th>
Validade
</th>


<th>
Subtotal
</th>


<th>
Ação
</th>


</tr>


</thead>



<tbody id="listaCompra">


<tr>

<td colspan="7">
Nenhum produto adicionado
</td>


</tr>


</tbody>



</table>


</div>






<h3>

Total:
<span id="totalCompra">
0.00 Kz
</span>


</h3>



</section>






</main>






<script src="js/app.js"></script>

<script src="js/auth.js"></script>

<script src="js/compras.js"></script>



</body>

</html>
